<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <nav class="border-b border-gray-800 p-4 mb-8 glass sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="trending-up" class="text-emerald-400"></i>
                <span class="font-bold text-xl tracking-tight">StockSim <span class="text-emerald-500 text-xs italic">v1.0</span></span>
            </div>
            <button onclick="triggerChaos()" class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg border border-red-800 transition-all flex items-center gap-2">
                <i data-lucide="zap" size="18"></i> Chaos Mode
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- KOLUMNA 1: Portfel -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="wallet" class="text-blue-400"></i> Twój Portfel
                </h2>
                <div class="flex gap-2 mb-6">
                    <input id="walletId" type="text" placeholder="ID Portfela (np. user123)" class="bg-gray-800 border-gray-700 rounded-lg p-2 w-full focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="refreshWallet()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg transition-colors">
                        Wczytaj
                    </button>
                </div>
                <div id="walletContent" class="space-y-3">
                    <p class="text-gray-500 italic text-sm text-center">Wpisz ID portfela, aby zobaczyć stan posiadania.</p>
                </div>
            </div>
        </section>

        <!-- KOLUMNA 2: Rynek (Bank) -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i data-lucide="landmark" class="text-emerald-400"></i> Dostępne Akcje
                    </h2>
                    <button onclick="refreshBank()" class="text-gray-400 hover:text-white transition-colors">
                        <i data-lucide="refresh-cw" size="18"></i>
                    </button>
                </div>
                <div id="bankContent" class="space-y-4">
                    <!-- Dynamiczne akcje -->
                </div>
                <hr class="border-gray-800 my-6">
                <div>
                    <h3 class="text-sm font-semibold text-gray-400 mb-2 uppercase tracking-widest">Inicjalizacja Banku (JSON)</h3>
                    <textarea id="bankInitJson" rows="3" class="bg-gray-800 border-gray-700 rounded-lg p-2 w-full text-xs font-mono mb-2" placeholder='{"stocks": [{"name":"BTC", "quantity":10}]}'></textarea>
                    <button onclick="initBank()" class="w-full bg-emerald-700/20 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-800 p-2 rounded-lg transition-all">
                        Ustaw Stan Banku
                    </button>
                </div>
            </div>
        </section>

        <!-- KOLUMNA 3: Logi (Audit Log) -->
        <section class="lg:col-span-1 space-y-6">
            <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl h-[600px] flex flex-col">
                <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="history" class="text-purple-400"></i> Historia Operacji
                </h2>
                <div id="auditLogs" class="overflow-y-auto flex-grow space-y-2 pr-2 text-sm font-mono">
                    <!-- Logi -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // Inicjalizacja ikon
        lucide.createIcons();

        async function apiCall(path, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            try {
                const res = await fetch(path, options);
                if (!res.ok) throw await res.text();
                return res.headers.get('content-type')?.includes('application/json') ? await res.json() : await res.text();
            } catch (err) {
                alert(`Błąd: ${err}`);
                return null;
            }
        }

        async function refreshBank() {
            const data = await apiCall('/stocks');
            if (!data) return;
            const container = document.getElementById('bankContent');
            container.innerHTML = data.stocks.map(s => `
                <div class="flex justify-between items-center bg-gray-800/50 p-3 rounded-xl border border-gray-700">
                    <div>
                        <span class="font-bold text-emerald-400">${s.name}</span>
                        <span class="text-xs text-gray-500 ml-2">Dostępne: ${s.quantity}</span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="trade('${s.name}', 'buy')" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1 rounded shadow-lg transition-all">KUP</button>
                    </div>
                </div>
            `).join('');
        }

        async function refreshWallet() {
            const id = document.getElementById('walletId').value;
            if(!id) return alert("Podaj ID portfela!");
            const data = await apiCall(`/wallets/${id}`);
            if (!data) return;
            const container = document.getElementById('walletContent');
            container.innerHTML = data.stocks.length ? data.stocks.map(s => `
                <div class="flex justify-between items-center bg-blue-900/10 p-3 rounded-xl border border-blue-900/30">
                    <span>${s.name} <b class="text-blue-400">x${s.quantity}</b></span>
                    <button onclick="trade('${s.name}', 'sell')" class="bg-rose-600 hover:bg-rose-500 text-xs px-3 py-1 rounded shadow-lg transition-all">SPRZEDAJ</button>
                </div>
            `).join('') : '<p class="text-center text-gray-500">Portfel jest pusty.</p>';
            refreshLogs();
        }

        async function trade(stockName, type) {
            const id = document.getElementById('walletId').value || 'anonymous';
            document.getElementById('walletId').value = id;
            await apiCall(`/wallets/${id}/stocks/${stockName}`, 'POST', { type });
            refreshBank();
            refreshWallet();
        }

        async function refreshLogs() {
            const data = await apiCall('/log');
            if (!data) return;
            const container = document.getElementById('auditLogs');
            container.innerHTML = data.log.reverse().map(l => `
                <div class="p-2 border-l-2 ${l.type === 'buy' ? 'border-emerald-500 bg-emerald-500/5' : 'border-rose-500 bg-rose-500/5'} mb-2">
                    <span class="text-gray-400">[${l.type.toUpperCase()}]</span> <b>${l.stock_name}</b> <br/>
                    <span class="text-[10px] text-gray-500">ID: ${l.wallet_id}</span>
                </div>
            `).join('');
        }

        async function initBank() {
            const json = document.getElementById('bankInitJson').value;
            await apiCall('/stocks', 'POST', JSON.parse(json));
            refreshBank();
        }

        function triggerChaos() {
            if(confirm("Czy na pewno chcesz zabić tę instancję?")) apiCall('/chaos', 'POST');
        }

        // Auto-refresh banku co 5 sekund
        setInterval(refreshBank, 5000);
        refreshBank();
    </script>
</body>
</html>
