<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockSim — Symulator Giełdy</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

<nav>
    <div class="nav-brand">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
            <polyline points="16 7 22 7 22 13"/>
        </svg>
        StockSim
        <span class="ticker">LIVE</span>
    </div>

    <div class="nav-right">
        <div class="status-indicator">
            <div class="status-dot"></div>
            SYSTEM ONLINE
        </div>
        <button id="chaos-btn" class="btn btn-chaos" onclick="triggerChaos()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            CHAOS MODE
        </button>
    </div>
</nav>

<main>

    <div class="ticker-bar" id="ticker-bar">
        <span class="ticker-item" style="color:var(--text-dim)">ŁADOWANIE NOTOWAŃ...</span>
    </div>

    <section class="panel">
        <div class="panel-header">
        <span class="panel-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h7"/>
            <path d="M16 19l2 2 4-4"/>
          </svg>
          Portfel
        </span>
            <span id="wallet-header-id" style="font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--blue)"></span>
        </div>

        <div class="input-row">
            <input
                    id="wallet-id"
                    type="text"
                    placeholder="ID portfela (np. user123)"
                    onkeydown="if(event.key==='Enter') loadWallet()"
            />
            <button class="btn btn-load" onclick="loadWallet()">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                WCZYTAJ
            </button>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-label">W banku</span>
                <span class="stat-value green" id="stat-total-qty">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Rodzaje</span>
                <span class="stat-value" id="stat-types">—</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Operacje</span>
                <span class="stat-value" id="stat-log-count">—</span>
            </div>
        </div>

        <div class="scroll-area" id="wallet-stocks">
            <div class="empty-state">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M21 12V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h7"/>
                    <circle cx="17" cy="17" r="4"/>
                    <path d="M17 15v2l1 1"/>
                </svg>
                WPISZ ID PORTFELA
            </div>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
        <span class="panel-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
          </svg>
          Bank / Rynek
        </span>
            <button class="btn btn-ghost" style="padding:4px 8px" onclick="refreshBank()">
                <svg id="refresh-icon-bank" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"/>
                </svg>
            </button>
        </div>

        <div class="scroll-area" id="bank-stocks" style="max-height:200px">
            <div class="empty-state">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
                </svg>
                ŁADOWANIE...
            </div>
        </div>

        <div class="init-section">
            <span class="section-label">Dodaj akcje do banku</span>

            <div class="input-row">
                <input
                        id="new-stock-name"
                        type="text"
                        placeholder="Nazwa (np. AAPL)"
                        style="text-transform:uppercase"
                />
                <input
                        id="new-stock-qty"
                        type="number"
                        value="100"
                        min="1"
                        style="width:90px;flex:none"
                />
                <button class="btn btn-primary" onclick="addPendingStock()">
                    + DODAJ
                </button>
            </div>

            <div id="pending-stocks" style="display:flex;flex-direction:column;gap:6px;min-height:32px"></div>

            <button class="btn btn-primary" onclick="sendBankStocks()" style="width:100%;justify-content:center">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                USTAW STAN BANKU
            </button>
        </div>
    </section>

    <section class="panel">
        <div class="panel-header">
        <span class="panel-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          Historia Operacji
        </span>
            <button class="btn btn-ghost" style="padding:4px 8px" onclick="refreshLog(false);spinRefresh('refresh-icon-log')">
                <svg id="refresh-icon-log" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M1 4v6h6M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"/>
                </svg>
            </button>
        </div>

        <div class="scroll-area" id="audit-log">
            <div class="empty-state">
                <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                BRAK OPERACJI
            </div>
        </div>
    </section>

</main>

<div id="toast-container"></div>

</body>
</html>
