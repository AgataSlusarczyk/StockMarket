events {
    worker_connections 1024;
}
http {
    upstream backend {
        server app1:8080;
        server app2:8080;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://backend;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}